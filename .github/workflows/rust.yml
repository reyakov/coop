name: Rust

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["m**"]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        rustup: [stable]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: script/linux
        run: chmod +x ./script/linux && ./script/linux
        if: matrix.os == 'ubuntu-latest'

      - name: Build
        run: cargo build --verbose

      - name: Run tests
        run: cargo test --verbose

  check-wasm:
    name: Check web target
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@nightly
        with:
          targets: wasm32-unknown-unknown
          components: llvm-tools-preview

      - name: Install wasm C toolchain
        run: sudo apt-get update && sudo apt-get install -y clang llvm

      - name: Check web target
        env:
          CC_wasm32_unknown_unknown: clang
          AR_wasm32_unknown_unknown: llvm-ar
        run: cargo +nightly check -p coop_web --target wasm32-unknown-unknown
